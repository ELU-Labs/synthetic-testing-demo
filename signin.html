<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="build" content="__BUILD_SHA__">
  <title>Sign in — Acme Outfitters</title>
  <link rel="stylesheet" href="assets/style.css?v=__BUILD_SHA__">
  <script src="assets/app.js?v=__BUILD_SHA__" defer></script>
</head>
<body data-page="signin">
  <div id="error-banner" class="error-banner" role="alert" hidden>Something went wrong. Please refresh the page.</div>
  <header id="site-header"><a href="index.html" class="brand">Acme Outfitters</a></header>
  <main>
    <section class="signin">
      <h1>Sign in</h1>
      <form id="signin-form">
        <div class="form-row"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
        <div class="form-row"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
        <button type="submit" class="primary">Sign in</button>
        <p id="signin-error" class="error" role="alert"></p>
      </form>
    </section>
  </main>
  <footer>Acme Outfitters is a demo store used to test ELU synthetic testing. Nothing here is for sale.</footer>
</body>
</html>
